name: Prüfer

# Regel-Check ohne KI für jeden PR gegen main: Fehlerliste aus CLAUDE.md, SQL-Migrationen, Geheimnisse, npm audit.
# Nur neu hinzugefügte Zeilen zählen. Fehler machen den Check rot (blockiert den Merge, wenn "Regel-Check" in der
# Branch-Schutzregel für main als Pflicht eingetragen ist), Hinweise bleiben gelbe Anmerkungen.
# Das KI-Review läuft getrennt davon auf dem Server und meldet nach Discord #pruefer.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regeln:
    name: Regel-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (ganze Historie für den Vergleich mit main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regeln prüfen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/pruefer/regeln.mjs --base "origin/$BASE_REF" --head HEAD --github
